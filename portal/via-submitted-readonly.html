<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#123f3d">
<title>AidMe · Innsendt VÍA-veikart</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./form-review.css?v=20261123a">
<style>
body{background:#f7f5f0;color:#173b3b}.via-view{width:min(980px,calc(100% - 32px));margin:28px auto 65px}.via-view .panel-card{margin-bottom:16px}.via-view h1{margin:0 0 12px}.via-view .review-value{white-space:pre-wrap;overflow-wrap:anywhere}.via-actions{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.via-field{padding:11px 0;border-bottom:1px solid #e7e3da}.via-field:last-child{border-bottom:0}.via-field strong{display:block}.via-error{border-left:5px solid #a55c41}.via-view[aria-busy="true"] #viaReview{display:none}
</style>
<script>
/* Minimal staff read-only route: bypass the generic form runner only for an
   already-submitted VÍA review carrying an exact originating task. */
setTimeout(function(){
  var status=document.getElementById('viaStatus');
  if(status&&status.dataset.state==='loading'){
    status.dataset.state='error';status.textContent='Innsendt veikart kunne ikke åpnes innen fristen. Ingen data er endret. Bruk Tilbake til oppgaven.';
  }
},16000);
</script>
</head>
<body>
<main class="via-view" aria-busy="true">
  <nav class="via-actions" aria-label="Navigasjon"><a id="viaBackTop" class="ghost" href="./#tasks">Tilbake til oppgaven</a><a class="ghost" href="./">Til AidMe Portal</a></nav>
  <header class="panel-card"><p class="eyebrow">VÍA · medarbeider · kun lesing</p><h1>Innsendt VÍA-veikart</h1><p>Du leser en eksisterende registrering. Ingen lagring, ny innsending eller GO/NO-GO gjennomføres her.</p></header>
  <section class="panel-card" aria-live="polite"><p id="viaStatus" data-state="loading" role="status">Kontrollerer innlogging og gjeldende, avgrensede tilgang …</p><p id="viaSecurity" class="privacy-note"></p></section>
  <section id="viaReview" class="panel-card" hidden aria-label="Skrivebeskyttet innsendt skjema"></section>
  <nav class="via-actions"><a id="viaBackBottom" class="primary" href="./#tasks">Tilbake til oppgaven</a></nav>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./via-submitted-readonly.js?v=20261123a"></script>
</body>
</html>
