<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AidMe VIDA · Mine dokumenter</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./documents.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="doc-shell"><header class="doc-top"><div><p class="eyebrow">Personlig arbeidsarkiv</p><h1>Mine dokumenter</h1><p>Privat lagring med tofaktor, tilgangsstyring og revisjon.</p></div><a class="ghost" href="./">Til portal</a></header><article id="blocked" class="panel-card warning-card hidden"><h2>Bekreft tofaktor</h2><p>Dokumentarkivet krever AAL2 før filer kan vises, lastes opp eller slettes.</p><a class="primary" href="./#security">Åpne sikkerhet</a></article><section id="workspace" class="hidden"><form id="uploadForm" class="panel-card doc-upload"><div><p class="eyebrow">Last opp</p><h2>Nytt dokument</h2></div><label><span>Tittel</span><input id="title" required maxlength="120"></label><div class="doc-grid"><label><span>Kategori</span><select id="category"><option value="WORK">Arbeid</option><option value="VIA">VÍA</option><option value="SER">SER</option><option value="VIDA">VIDA</option><option value="OTHER">Annet</option></select></label><label><span>Klassifisering</span><select id="sensitivity"><option value="NORMAL">Normal</option><option value="LIMITED">Begrenset</option><option value="SENSITIVE">Sensitiv</option></select></label></div><label><span>Fil</span><input id="file" type="file" required accept=".pdf,.jpg,.jpeg,.png,.webp,.docx,.xlsx,.txt"><small>Maks 25 MB. Ikke bruk arkivet som erstatning for journal eller akutt beredskap.</small></label><button class="primary" type="submit">Last opp sikkert</button><p id="message" class="message" aria-live="polite"></p></form><article class="panel-card"><div class="card-head"><div><p class="eyebrow">Arkiv</p><h2>Dine filer</h2></div><button id="refresh" class="ghost">Oppdater</button></div><div id="list" class="doc-list"><p>Laster…</p></div></article></section></div><script src="./documents.js"></script></body></html>
