name: Public candidate preview

on:
  push:
    branches: [public-mobile-ux-20260818]
    paths:
      - 'public-site/current/**'
      - '.github/workflows/public-candidate-preview.yml'

permissions:
  contents: read

env:
  CANDIDATE_SITE_ID: 1b763521-f8c0-462a-a0cc-915c1ae56d08

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require existing Netlify Actions secret
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo 'NETLIFY_AUTH_TOKEN is not configured in GitHub Actions; no deployment attempted.' >&2
            exit 42
          fi
      - name: Deploy draft preview to non-production candidate site
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          npx -y netlify-cli@latest deploy \
            --dir=public-site/current \
            --site="$CANDIDATE_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="PR42 mobile UX candidate ${GITHUB_SHA}" \
            --json > /tmp/netlify-preview.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/netlify-preview.json','utf8'));
          const url=x.deploy_url||x.deploy_ssl_url||x.url||'';
          if(!url) throw new Error('Netlify CLI returned no draft preview URL');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Draft preview created on non-production candidate site.\n\nDeploy URL: ${url}\n`);
          console.log(`Draft preview created: ${url}`);
          NODE
