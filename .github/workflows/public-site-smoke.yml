name: Public site smoke

on:
  pull_request:
    paths:
      - 'public-site/current/**'
      - '.github/workflows/public-site-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'public-site/current/**'
      - '.github/workflows/public-site-smoke.yml'

permissions:
  contents: read

jobs:
  static-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public source / UX candidate integrity
        shell: bash
        run: |
          set -euo pipefail
          ROOT='public-site/current'
          pages=(index via ser vida deltakere partnere ruter om kontakt)
          for page in "${pages[@]}"; do
            test -f "$ROOT/$page.html"
            grep -q '<meta name="viewport"' "$ROOT/$page.html"
            grep -q '<footer class="site-footer"' "$ROOT/$page.html"
            grep -q 'site.js?v=20260818b' "$ROOT/$page.html"
            count=$(grep -o '<h1' "$ROOT/$page.html" | wc -l | tr -d ' ')
            test "$count" = '1'
          done
          test -f "$ROOT/site.css"
          test -f "$ROOT/refine.css"
          test -f "$ROOT/site.js"
          test -f "$ROOT/mobile-ux.css"
          test -f "$ROOT/SOURCE_PARITY_MANIFEST_2026-08-18.json"
          grep -q 'naturalContentHeight' "$ROOT/site.js"
          ! grep -q 'document.documentElement.scrollHeight' "$ROOT/site.js"
          grep -q 'mobile-process-nav' "$ROOT/site.js"
          grep -q 'has-card-link' "$ROOT/site.js"
          grep -q 'my.AidMe' "$ROOT/site.js"
          grep -q 'grid-template-columns: 1fr' "$ROOT/mobile-ux.css"
          grep -q 'Gå videre til VIDA' "$ROOT/ser.html"
          grep -q 'Under lading' "$ROOT/via.html"

          # Exact byte identity for the intentional UI delta. PR #39 remains the
          # authority for the original source-parity site.js blob.
          test "$(git hash-object "$ROOT/site.js")" = '22eee3cea3159dd7a8aa2311e597e90fd0e667df'
          test "$(git hash-object "$ROOT/mobile-ux.css")" = '9512227a22ba281f94644887c5e723bedb8b02dd'

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys

          root = Path('public-site/current')
          manifest_path = root / 'SOURCE_PARITY_MANIFEST_2026-08-18.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          errors = []

          for item in manifest.get('files', []):
              rel = item['path']
              # site.js is an intentional, separately pinned UI delta in this branch.
              if rel == 'site.js':
                  continue
              expected_size = int(item['size'])
              expected_sha = item['sha256'].lower()
              path = root / rel
              if not path.is_file():
                  errors.append(f'MISSING {rel}')
                  continue
              data = path.read_bytes()
              actual_size = len(data)
              actual_sha = hashlib.sha256(data).hexdigest()
              if actual_size != expected_size:
                  errors.append(f'SIZE {rel}: {actual_size} != {expected_size}')
              if actual_sha != expected_sha:
                  errors.append(f'SHA256 {rel}: {actual_sha} != {expected_sha}')

          if errors:
              print('Public UX candidate integrity FAILED:', file=sys.stderr)
              for error in errors:
                  print(f' - {error}', file=sys.stderr)
              sys.exit(1)

          print('Baseline manifest parity passed; intentional UI files passed pinned Git-blob checks.')
          PY

          echo 'Public UX candidate integrity checks passed.'
