name: Rehydrate canonical public assets

on:
  push:
    branches: [public-source-parity-20260818]
    paths:
      - '.github/workflows/public-asset-rehydrate.yml'

permissions:
  contents: write

jobs:
  rehydrate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-source-parity-20260818
          fetch-depth: 0
      - name: Fetch immutable Netlify assets and verify manifest
        shell: bash
        env:
          CANONICAL_DEPLOY: https://6a818fb0563075817cf6ffdd--aidme-public-preview.netlify.app
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, urllib.request

          root = Path('public-site/current')
          manifest = json.loads((root / 'SOURCE_PARITY_MANIFEST_2026-08-18.json').read_text(encoding='utf-8'))
          base = os.environ['CANONICAL_DEPLOY'].rstrip('/')
          changed = []

          for item in manifest.get('files', []):
              rel = item['path']
              if not rel.lower().endswith('.webp'):
                  continue
              target = root / rel
              expected_size = int(item['size'])
              expected_sha = item['sha256'].lower()

              if target.is_file():
                  data = target.read_bytes()
                  if len(data) == expected_size and hashlib.sha256(data).hexdigest() == expected_sha:
                      print(f'OK existing {rel}')
                      continue

              url = f"{base}/{rel}"
              print(f'FETCH {url}')
              req = urllib.request.Request(url, headers={'User-Agent':'AidMe-source-parity/1.0'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()

              actual_size = len(data)
              actual_sha = hashlib.sha256(data).hexdigest()
              if actual_size != expected_size:
                  raise SystemExit(f'SIZE mismatch {rel}: {actual_size} != {expected_size}')
              if actual_sha != expected_sha:
                  raise SystemExit(f'SHA256 mismatch {rel}: {actual_sha} != {expected_sha}')

              target.parent.mkdir(parents=True, exist_ok=True)
              tmp = target.with_suffix(target.suffix + '.tmp')
              tmp.write_bytes(data)
              tmp.replace(target)
              changed.append(rel)
              print(f'VERIFIED {rel} {actual_size} {actual_sha}')

          # Fail closed: all WebP entries must now exist and match exactly.
          errors = []
          for item in manifest.get('files', []):
              rel = item['path']
              if not rel.lower().endswith('.webp'):
                  continue
              path = root / rel
              if not path.is_file():
                  errors.append(f'MISSING {rel}')
                  continue
              data = path.read_bytes()
              if len(data) != int(item['size']):
                  errors.append(f'SIZE {rel}')
              if hashlib.sha256(data).hexdigest() != item['sha256'].lower():
                  errors.append(f'SHA256 {rel}')
          if errors:
              raise SystemExit('Asset parity FAILED: ' + '; '.join(errors))
          print(f'Asset parity verified. Downloaded {len(changed)} file(s).')
          PY
      - name: Commit verified assets to parity branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-site/current/assets/*.webp
          if git diff --cached --quiet; then
            echo 'No asset changes required.'
            exit 0
          fi
          git commit -m 'Rehydrate canonical public WebP assets'
          git push origin HEAD:public-source-parity-20260818
