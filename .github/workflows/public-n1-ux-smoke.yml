name: Public N1 UX Smoke

on:
  pull_request:
    paths:
      - 'public-site/current/**'
      - '.github/workflows/public-n1-ux-smoke.yml'
  workflow_dispatch:

jobs:
  n1-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check public-site/current/n1-ux.js
          node --check public-site/current/n1-intake-safe.js
          node --check public-site/current/site.js
      - name: N1 content and interaction invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f public-site/current/n1-ux.css
          test -f public-site/current/n1-ux.js
          test -f public-site/current/n1-intake-safe.js
          test -f public-site/current/takk.html
          test ! -f public-site/current/forms.html
          grep -q 'Portugal → Spania' public-site/current/n1-ux.js
          grep -q 'Tre steg er hele løpet' public-site/current/n1-ux.js
          grep -q 'Se om dette kan passe for meg' public-site/current/n1-ux.js
          grep -q 'Målgang, mestring' public-site/current/n1-ux.js
          grep -q 'n1-ux.js' public-site/current/site.js
          grep -q 'n1-intake-safe.js' public-site/current/kontakt.html
          grep -q 'n1-intake-safe.js' public-site/current/takk.html
      - name: Hardened intake gate invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'functions/v1/public-intake' public-site/current/n1-intake-safe.js
          grep -q 'enabled: false' public-site/current/n1-intake-safe.js
          grep -q 'turnstile' public-site/current/n1-intake-safe.js
          grep -q "removeAttribute('data-netlify')" public-site/current/n1-intake-safe.js
          grep -q 'Ingen persondata lagres' public-site/current/n1-intake-safe.js
          grep -q 'Ikke skriv helseopplysninger' public-site/current/n1-ux.js
          ! grep -q 'createClient' public-site/current/n1-intake-safe.js
          ! grep -q "from('intakes')" public-site/current/n1-intake-safe.js
          ! grep -R -E 'data-netlify="true"|netlify-honeypot=' public-site/current --include='*.html'
      - name: Three-stage public narrative guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VÍA → SER → VIDA' public-site/current/site.js
          ! grep -q 'STEG 4' public-site/current/n1-ux.js
