      - '.github/workflows/public-live-feedback-20260824.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node public-site/current/live-feedback-20260824-smoke.mjs
      - run: node public-site/current/ser-image-hires-smoke.mjs
