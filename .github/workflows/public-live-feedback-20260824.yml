name: Public LIVE feedback 20260824

on:
  pull_request:
    paths:
      - 'public-site/current/live-feedback-20260824.js'
      - 'public-site/current/live-feedback-20260824-smoke.mjs'
      - 'public-site/current/ser-image-hires-smoke.mjs'
      - 'public-site/current/site.js'
      - 'public-site/current/assets/santiago-4-ser.jpg'
      - '.github/workflows/public-live-feedback-20260824.yml'
  push:
    branches: [main]
    paths:
      - 'public-site/current/live-feedback-20260824.js'
      - 'public-site/current/live-feedback-20260824-smoke.mjs'
      - 'public-site/current/ser-image-hires-smoke.mjs'
