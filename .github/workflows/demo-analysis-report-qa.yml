name: Demo analysis report browser QA (synthetic only)

on:
  pull_request:
    paths:
      - 'portal/measurement-comparison-preview.html'
      - 'portal/measurement-comparison-preview-smoke.mjs'
      - 'portal/index.html'
      - 'portal/analysis-hub-uat.js'
      - 'portal/analysis-hub-uat.css'
      - 'portal/analysis-hub-uat-smoke.mjs'
      - 'portal/uat-start-20261102.html'
      - 'portal/ser-five-checkin-uat.html'
      - 'portal/ser-five-checkin-uat-smoke.mjs'
      - '.github/workflows/demo-analysis-report-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-report-print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chrome screenshot and A4 PDF export for the synthetic page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p demo-report-qa
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          node portal/measurement-comparison-preview-smoke.mjs
          node portal/analysis-hub-uat-smoke.mjs
          node portal/ser-five-checkin-uat-smoke.mjs
          python3 -m http.server 8876 --directory portal >/tmp/camino-report-qa.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          BASE="http://127.0.0.1:8876/measurement-comparison-preview.html"
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --hide-scrollbars --window-size=1280,2500 --virtual-time-budget=7000 \
            --screenshot=demo-report-qa/measurement-report-desktop.png "$BASE"
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --hide-scrollbars --window-size=390,2500 --virtual-time-budget=7000 \
            --screenshot=demo-report-qa/measurement-report-mobile.png "$BASE"
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --no-pdf-header-footer --print-to-pdf=demo-report-qa/AidMe_DEMO_SYNTHETIC_REPORT.pdf \
            --virtual-time-budget=7000 "$BASE"
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --hide-scrollbars --window-size=1280,2200 --virtual-time-budget=7000 \
            --screenshot=demo-report-qa/measurement-embedded-desktop.png "$BASE?embedded=1"
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --hide-scrollbars --window-size=1280,2200 --virtual-time-budget=7000 \
            --screenshot=demo-report-qa/uat-journey-desktop.png "http://127.0.0.1:8876/uat-start-20261102.html"
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --hide-scrollbars --window-size=390,2500 --virtual-time-budget=7000 \
            --screenshot=demo-report-qa/uat-journey-mobile.png "http://127.0.0.1:8876/uat-start-20261102.html"
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --hide-scrollbars --window-size=1100,1600 --virtual-time-budget=6000 \
            --screenshot=demo-report-qa/ser-five-checkin-desktop.png "http://127.0.0.1:8876/ser-five-checkin-uat.html"
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --hide-scrollbars --window-size=390,1700 --virtual-time-budget=6000 \
            --screenshot=demo-report-qa/ser-five-checkin-mobile.png "http://127.0.0.1:8876/ser-five-checkin-uat.html"
          test -s demo-report-qa/ser-five-checkin-desktop.png
          test -s demo-report-qa/ser-five-checkin-mobile.png
          test -s demo-report-qa/measurement-embedded-desktop.png
          test -s demo-report-qa/uat-journey-desktop.png
          test -s demo-report-qa/uat-journey-mobile.png
          test -s demo-report-qa/AidMe_DEMO_SYNTHETIC_REPORT.pdf
          test -s demo-report-qa/measurement-report-desktop.png
          test -s demo-report-qa/measurement-report-mobile.png
          python3 - <<'PY'
          from pathlib import Path
          pdf=Path('demo-report-qa/AidMe_DEMO_SYNTHETIC_REPORT.pdf').read_bytes()
          if not pdf.startswith(b'%PDF-'):
              raise SystemExit('Expected actual PDF file')
          print('Chrome print-to-PDF artifact:',len(pdf),'bytes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aidme-synthetic-measurement-report-qa
          path: demo-report-qa/
          retention-days: 14
