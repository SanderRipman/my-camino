name: Ephemeral public live cutover

on:
  pull_request:
    paths:
      - '.github/workflows/ephemeral-candidate-upload.yml'

permissions:
  contents: read

jobs:
  upload-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact visually-approved UI bytes
        shell: bash
        run: |
          set -euo pipefail
          ROOT='public-site/current'
          test "$(git hash-object "$ROOT/site.js")" = '22eee3cea3159dd7a8aa2311e597e90fd0e667df'
          test "$(git hash-object "$ROOT/mobile-ux.css")" = '9512227a22ba281f94644887c5e723bedb8b02dd'
          test -f "$ROOT/index.html"
          test -f "$ROOT/assets/hero-group.webp"
          node --check "$ROOT/site.js"
      - name: Upload exact approved directory to existing live alias project
        shell: bash
        env:
          NETLIFY_SCOPED_PROXY_BASE: 'https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..hlFm5t7XZ6YgTjBa.HNSIkuBu0rvFXg5tExEHMe2vCASjFJ1FhmGeD_eVgAQrRqWGOrat_b99A6Uq9CFxyxxdz6Mi_stxOkLgwZ3tGYfyG7GlVVkUFdxTkRWZfx592QhXogv1PC7Hh7GlJI_doqQr0W7FSzPurdT3HbBBLTRAxMA_bCHfma99Bthah-3roc4wuisa7qpGebp3SLr5XsZBF2ZRNXyxYkdQWSMbhki3ORl6H7HtQexCn22PWycXbjzl6mV2zv4ldOZxaHLmFz_MKjIPaD-kvy0TiSYr91BLefgD5JP8N6t_eIXOw-UHpwI7rlbs-K8psZexCW-gYjbahUCxlvMA8zBZkD98s-NoyYe07Em9cdXNp6bM7PI6SJN-hdBOvx8y5CTpVjiCadb1l_7g.SUH_k4C8df2aVee2Zw3kFg'
          LIVE_SITE_ID: '0513db00-a62f-4154-8e09-5fefc7ce1fe4'
        run: |
          set -euo pipefail
          cd public-site/current
          zip -qr /tmp/aidme-public-live.zip . -x '.DS_Store'
          upload_url="${NETLIFY_SCOPED_PROXY_BASE}/api/v1/sites/${LIVE_SITE_ID}/builds"
          response=$(curl --fail-with-body --silent --show-error \
            -H 'user-agent: netlify-mcp' \
            -F 'zip=@/tmp/aidme-public-live.zip;type=application/zip' \
            "$upload_url")
          deploy_id=$(printf '%s' "$response" | python -c 'import json,sys; x=json.load(sys.stdin); x=x[0] if isinstance(x,list) else x; print(x.get("deploy_id", ""))')
          build_id=$(printf '%s' "$response" | python -c 'import json,sys; x=json.load(sys.stdin); x=x[0] if isinstance(x,list) else x; print(x.get("id", ""))')
          test -n "$deploy_id"
          printf 'Live deploy ID: `%s`\n\nBuild ID: `%s`\n\nRollback baseline: `6a818fb0563075817cf6ffdd`\n' "$deploy_id" "$build_id" >> "$GITHUB_STEP_SUMMARY"
