name: Ephemeral public candidate upload

on:
  pull_request:
    paths:
      - '.github/workflows/ephemeral-candidate-upload.yml'

permissions:
  contents: read

jobs:
  upload-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact shell-style candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          ROOT='public-site/current'
          test "$(git hash-object "$ROOT/site.js")" = '9f680f1e41b4018e509e7baafac70ca1221237d1'
          test "$(git hash-object "$ROOT/mobile-ux.css")" = '9512227a22ba281f94644887c5e723bedb8b02dd'
          grep -q 'shellPresentation' "$ROOT/site.js"
          grep -q 'aidme-shell' "$ROOT/site.js"
          node --check "$ROOT/site.js"
      - name: Upload exact public directory to isolated candidate
        shell: bash
        env:
          NETLIFY_SCOPED_PROXY_BASE: 'https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..kfxTFOVJuLZ80kRM.ilfRRjHHymEDGj63zMQ4iQelutBHNa3xTZiBu1uZu10qjXS1nS8w3gjT_2Ky8oAMlDwUSqIjPIBuq9trYBeq2JDTcVT02DlJjb9NnAschv5ew_ouCfT9u8Ty6NWt9eaHDb7ydOhua2z61PSRB6zzTajdUZAGkc9UAkUYG232s44qCdRlt9Ybyd1JOJRu2KJDbeji4E_zofNc-LGED3Tr-UC5qmdQ88fb5c6kzO3dacBt77ex-iyhCQ9SHSzdQNiuj5dRJapwIhz77sXfDLRF3l2vQM4-T6zPK7Ud_8Huwv3eQiYdv7h-aI6yJ4onYj9vR0iFLlXwXRt1Zp9mbL7FQr563NnU4JHMw9XK88pTLrLaVPzUXVooT5xFlIzFWERB5-8dfRJi.rz8EusN7UXb11RK6sz-35g'
          CANDIDATE_SITE_ID: '1b763521-f8c0-462a-a0cc-915c1ae56d08'
        run: |
          set -euo pipefail
          cd public-site/current
          zip -qr /tmp/aidme-public-candidate.zip . -x '.DS_Store'
          upload_url="${NETLIFY_SCOPED_PROXY_BASE}/api/v1/sites/${CANDIDATE_SITE_ID}/builds"
          response=$(curl --fail-with-body --silent --show-error \
            -H 'user-agent: netlify-mcp' \
            -F 'zip=@/tmp/aidme-public-candidate.zip;type=application/zip' \
            "$upload_url")
          deploy_id=$(printf '%s' "$response" | python -c 'import json,sys; x=json.load(sys.stdin); x=x[0] if isinstance(x,list) else x; print(x.get("deploy_id", ""))')
          test -n "$deploy_id"
          printf 'Candidate deploy ID: `%s`\n' "$deploy_id" >> "$GITHUB_STEP_SUMMARY"
