name: P0 admin role lifecycle
on:
  pull_request:
    paths:
      - 'portal/admin.js'
      - 'portal/admin-early-uat.js'
      - 'portal/admin-role-lifecycle-p0-smoke.mjs'
      - 'supabase/functions/admin-update-role/index.ts'
      - 'supabase/functions/admin-revoke-role/index.ts'
      - '.github/workflows/admin-role-lifecycle-p0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  role-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check portal/admin.js
          node --check portal/admin-early-uat.js
      - name: Role lifecycle boundaries
        run: node portal/admin-role-lifecycle-p0-smoke.mjs
