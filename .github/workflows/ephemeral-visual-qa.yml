name: Ephemeral public visual QA

on:
  pull_request:
    paths:
      - '.github/workflows/ephemeral-visual-qa.yml'

permissions:
  contents: read

jobs:
  chrome-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure first iframe height report
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          mkdir -p visual-qa /tmp/aidme-harness
          cat > /tmp/aidme-harness/index.html <<'HTML'
          <!doctype html><html><body style="margin:0">
          <div id="result">WAITING</div>
          <iframe id="frame" src="https://aidme-public-candidate-20260817.netlify.app/" style="width:360px;height:420px;border:0"></iframe>
          <script>
          const result=document.getElementById('result');
          window.addEventListener('message',e=>{
            if(result.dataset.height)return;
            const d=e.data||{};
            if(d.type!=='aidme-vida:content-height')return;
            result.textContent='HEIGHT='+d.height+' PATH='+d.path+' ORIGIN='+e.origin;
            result.dataset.height=String(d.height);
          });
          </script></body></html>
          HTML
          python3 -m http.server 8765 --directory /tmp/aidme-harness >/tmp/aidme-harness.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          timeout 25s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --window-size=390,900 --virtual-time-budget=5000 --dump-dom \
            'http://127.0.0.1:8765/' > visual-qa/iframe-protocol.html || test -s visual-qa/iframe-protocol.html
          grep -o 'HEIGHT=[0-9][0-9]*[^<]*' visual-qa/iframe-protocol.html | head -1 > visual-qa/iframe-height.txt
          height=$(grep -o 'data-height="[0-9][0-9]*"' visual-qa/iframe-protocol.html | head -1 | grep -o '[0-9][0-9]*')
          test -n "$height"
          echo "reported_height=$height"
          printf 'reported_height=%s\n' "$height" > visual-qa/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aidme-public-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 1
