name: Ephemeral public visual QA

on:
  pull_request:
    paths:
      - '.github/workflows/ephemeral-visual-qa.yml'
      - 'ops/wix/aidme-public-shell.js'

permissions:
  contents: read

jobs:
  chrome-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fail-safe shell against approved Netlify alias
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          mkdir -p visual-qa /tmp/aidme-shell-test
          {
            printf '%s\n' '<!doctype html><html><body style="margin:0"><div id="SITE_CONTAINER" style="height:420px;background:#ddd">LEGACY-FALLBACK</div><script>'
            cat ops/wix/aidme-public-shell.js
            printf '%s\n' '</script></body></html>'
          } > /tmp/aidme-shell-test/index.html
          python3 -m http.server 8765 --directory /tmp/aidme-shell-test >/tmp/aidme-shell-test.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1

          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --window-size=390,900 --virtual-time-budget=9000 --dump-dom \
            'http://127.0.0.1:8765/' > visual-qa/shell-dom.html || test -s visual-qa/shell-dom.html
          grep -q 'id="aidme-public-git-shell"' visual-qa/shell-dom.html
          grep -q 'data-state="active"' visual-qa/shell-dom.html
          grep -q 'data-aidme-legacy-hidden="1"' visual-qa/shell-dom.html
          height=$(grep -o 'data-height="[0-9][0-9]*"' visual-qa/shell-dom.html | head -1 | grep -o '[0-9][0-9]*')
          test -n "$height"
          test "$height" -gt 3000
          echo "shell_reported_height=$height"

          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --hide-scrollbars --window-size=390,2200 --virtual-time-budget=9000 \
            --screenshot=visual-qa/shell-mobile.png 'http://127.0.0.1:8765/'
          test -s visual-qa/shell-mobile.png
          printf 'shell_reported_height=%s\n' "$height" > visual-qa/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aidme-public-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 1
