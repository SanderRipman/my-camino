name: Ephemeral public visual QA

on:
  pull_request:
    paths:
      - '.github/workflows/ephemeral-visual-qa.yml'

permissions:
  contents: read

jobs:
  chrome-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect rendered Wix iframe hierarchy
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          mkdir -p visual-qa
          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --window-size=1440,1200 --virtual-time-budget=10000 --dump-dom \
            'https://www.aidme.no/' > visual-qa/live-dom.html || test -s visual-qa/live-dom.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.rows=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=='iframe':
                      a=dict(attrs); self.rows.append(a)
          p=P(); p.feed(Path('visual-qa/live-dom.html').read_text(errors='ignore'))
          lines=[]
          for i,a in enumerate(p.rows,1):
              lines.append(f"{i}: src={a.get('src','')} height={a.get('height','')} style={a.get('style','')} title={a.get('title','')} id={a.get('id','')}")
          Path('visual-qa/iframes.txt').write_text('\n'.join(lines))
          print('\n'.join(lines))
          PY
          grep -n -i 'aidme-public-preview' visual-qa/live-dom.html | head -20 > visual-qa/preview-context.txt || true
          test -s visual-qa/iframes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aidme-public-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 1
