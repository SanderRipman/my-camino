name: Ephemeral public visual QA

on:
  pull_request:
    paths:
      - '.github/workflows/ephemeral-visual-qa.yml'

permissions:
  contents: read

jobs:
  chrome-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure iframe protocol and capture visual state
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          mkdir -p visual-qa /tmp/aidme-harness
          capture() {
            local name="$1" width="$2" height="$3" url="$4"
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --window-size="${width},${height}" \
              --virtual-time-budget=8000 \
              --screenshot="visual-qa/${name}.png" \
              "$url"
            test -s "visual-qa/${name}.png"
          }
          cat > /tmp/aidme-harness/index.html <<'HTML'
          <!doctype html><html><body style="margin:0">
          <div id="result">WAITING</div>
          <iframe id="frame" src="https://aidme-public-candidate-20260817.netlify.app/" style="width:360px;height:420px;border:0"></iframe>
          <script>
          const result=document.getElementById('result');
          const frame=document.getElementById('frame');
          window.addEventListener('message',e=>{
            const d=e.data||{};
            if(d.type!=='aidme-vida:content-height')return;
            result.textContent='HEIGHT='+d.height+' PATH='+d.path+' ORIGIN='+e.origin;
            result.dataset.height=String(d.height);
            frame.style.height=Math.ceil(Number(d.height)||420)+'px';
          });
          </script></body></html>
          HTML
          python3 -m http.server 8765 --directory /tmp/aidme-harness >/tmp/aidme-harness.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --window-size=390,900 --virtual-time-budget=8000 --dump-dom \
            'http://127.0.0.1:8765/' > visual-qa/iframe-protocol.html
          grep -o 'HEIGHT=[0-9][0-9]*[^<]*' visual-qa/iframe-protocol.html | head -1 > visual-qa/iframe-height.txt
          height=$(grep -o 'data-height="[0-9][0-9]*"' visual-qa/iframe-protocol.html | head -1 | grep -o '[0-9][0-9]*')
          test -n "$height"
          echo "reported_height=$height"
          test "$height" -gt 3000
          capture candidate-mobile 360 2200 'https://aidme-public-candidate-20260817.netlify.app/'
          capture candidate-desktop 1440 1800 'https://aidme-public-candidate-20260817.netlify.app/'
          capture live-mobile 360 2200 'https://www.aidme.no/'
          capture live-desktop 1440 1800 'https://www.aidme.no/'
          sha256sum visual-qa/* > visual-qa/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aidme-public-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 1
