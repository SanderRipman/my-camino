name: Portal invite and onboarding smoke
on:
  pull_request:
    paths:
      - 'portal/welcome.*'
      - 'portal/admin.*'
      - 'portal/intake.*'
      - 'portal/intake-n2.css'
      - 'portal/invite-stress-smoke.mjs'
      - 'supabase/functions/admin-invite-user/**'
      - 'supabase/functions/admin-create-participant/**'
      - 'supabase/functions/account-setup-command/**'
      - 'supabase/functions/intake-command/**'
      - '.github/workflows/portal-invite-onboarding-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate first-login and N2 to N3 chain
        run: node portal/invite-stress-smoke.mjs