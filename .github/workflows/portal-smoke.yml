name: Portal smoke

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'public-site/current/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '_redirects'
      - 'netlify.toml'
      - '.github/workflows/portal-smoke.yml'
  pull_request:
    paths:
      - 'portal/**'
      - 'public-site/current/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '_redirects'
      - 'netlify.toml'
      - '.github/workflows/portal-smoke.yml'

permissions:
  contents: read

jobs:
  syntax-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify expected active Supabase function source set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            account-setup-command
            admin-create-participant
            admin-grant-role
            admin-invite-user
            admin-list-access
            admin-revoke-role
            bootstrap-owner-once
            case-command
            demo-create-interest
            form-command
            intake-command
            onboarding-command
            participant-profile-command
            public-intake
            qa-cleanup-role-pack
            qa-create-role-pack
            rls-preview-selftest
            sos-command
            task-command
            workflow-command
          )
          for slug in "${expected[@]}"; do
            test -s "supabase/functions/${slug}/index.ts" || { echo "Missing version-controlled Edge Function source: ${slug}"; exit 1; }
          done
          count=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          test "$count" -eq "${#expected[@]}" || { echo "Function source set changed (${count} dirs vs ${#expected[@]} expected). Update live/Git parity explicitly."; exit 1; }
      - name: Check maintained JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in portal/*.js; do
            case "$f" in
              portal/app.js|portal/app-core-broken.js) continue ;;
            esac
            echo "Checking $f"
            node --check "$f"
          done
      - name: Build clean portal bundle
        run: node portal/build-app.mjs
      - name: Check built app syntax
        run: node --check portal/app.js
      - name: Verify clean bundle invariants
        run: node portal/smoke-test.mjs
      - name: Verify context drilldown invariants
        run: node portal/context-drilldown-smoke.mjs
      - name: Verify N2 intake triage invariants
        run: node portal/intake-n2-smoke.mjs
      - name: Verify participant/referral identity boundary
        run: node portal/intake-referral-smoke.mjs
      - name: Verify Mini CRM invariants
        run: node portal/crm-smoke.mjs
      - name: Verify holistic journey and role invariants
        run: node portal/journey-role-smoke.mjs
      - name: Verify VÍA roadmap handoff invariants
        run: node portal/via-handoff-smoke.mjs
      - name: Verify GO decision and pre-SER journey invariants
        run: node portal/go-decision-journey-smoke.mjs
      - name: Verify pre-SER participant agreement/readiness v2 invariants
        run: node portal/pre-ser-agreement-smoke.mjs
      - name: Verify SER day-zero / normal-day and VIDA living-plan invariants
        run: node portal/ser-vida-journey-smoke.mjs
      - name: Verify explicit SER to VIDA staff handoff invariants
        run: node portal/ser-vida-handoff-smoke.mjs
