name: Rebuild portal flow bundle

on:
  push:
    branches: [portal-flow-ux-20260818]
    paths:
      - 'portal/app-flow.js'
      - 'portal/build-app.mjs'
      - '.github/workflows/portal-flow-rebuild.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portal-flow-ux-20260818
          fetch-depth: 0
      - name: Rebuild deterministic portal bundle
        shell: bash
        run: |
          set -euo pipefail
          npm run build:app
          node --check portal/app.js
      - name: Commit generated bundle when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal/app.js
          if git diff --cached --quiet; then
            echo 'Portal bundle already current.'
            exit 0
          fi
          git commit -m 'Rebuild portal bundle for flow UX'
          git push origin HEAD:portal-flow-ux-20260818
